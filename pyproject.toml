[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indirect-injection-span-quarantiner"
version = "0.1.0"
description = "Wraps untrusted external data with cryptographic boundaries and scores imperative prompt-injection phrases"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
indirect-injection-span-quarantiner = "indirect_injection_span_quarantiner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["indirect_injection_span_quarantiner*"]
